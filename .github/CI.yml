---
name: Build Windows

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:  # permite lanzarlo manualmente desde la UI de GitHub

permissions:
  contents: read

jobs:
  build:
    name: Windows AMD64
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4
        with:
          submodules: recursive

      # ── 2. MSYS2 base (solo wget primero, luego actualizamos) ─────────────
      - name: Setup MSYS2
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c  # v2
        with:
          msystem: ucrt64
          update: true
          install: wget

      # ── 3. Instalar todas las dependencias de compilación ─────────────────
      - name: Install build dependencies
        env:
          TOOLCHAIN: ucrt-x86_64
        run: |
          pacman -Syu --noconfirm \
            git \
            mingw-w64-${TOOLCHAIN}-boost \
            mingw-w64-${TOOLCHAIN}-cmake \
            mingw-w64-${TOOLCHAIN}-cppwinrt \
            mingw-w64-${TOOLCHAIN}-curl-winssl \
            mingw-w64-${TOOLCHAIN}-gcc \
            mingw-w64-${TOOLCHAIN}-graphviz \
            mingw-w64-${TOOLCHAIN}-MinHook \
            mingw-w64-${TOOLCHAIN}-miniupnpc \
            mingw-w64-${TOOLCHAIN}-nlohmann-json \
            mingw-w64-${TOOLCHAIN}-nsis \
            mingw-w64-${TOOLCHAIN}-onevpl \
            mingw-w64-${TOOLCHAIN}-openssl \
            mingw-w64-${TOOLCHAIN}-opus \
            mingw-w64-${TOOLCHAIN}-toolchain

      # ── 4. NodeJS (requerido para compilar la Web UI con npm) ────────────
      - name: Setup NodeJS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v4
        with:
          node-version: 'lts/*'

      # Convertir la ruta de NodeJS a formato MSYS2 y guardarla como variable de entorno
      - name: Export NodeJS path for MSYS2
        shell: pwsh
        run: |
          $nodeBin  = (Get-Command node).Source
          $nodePath = Split-Path $nodeBin -Parent
          echo "NODEJS_PATH=$nodePath" >> $env:GITHUB_ENV

      # ── 5. Python (requerido por glad, el generador de OpenGL/EGL) ────────
      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v5
        with:
          python-version: '3.12'

      # Convertir la ruta de Python a formato MSYS2 (backslashes → forward slashes)
      - name: Export Python path for MSYS2
        id: python-path
        run: |
          python_path=$(echo "${{ steps.setup-python.outputs.python-path }}" | sed 's/\\/\\\\/g')
          echo "python-path=${python_path}" >> "${GITHUB_OUTPUT}"

      # ── 6. Compilar ───────────────────────────────────────────────────────
      - name: Build
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BUILD_VERSION: ${{ github.sha }}
        run: |
          # Añadir NodeJS al PATH dentro de MSYS2
          NODEJS_PATH=$(cygpath "$NODEJS_PATH")
          export PATH="$PATH:$NODEJS_PATH"

          mkdir -p build
          cmake \
            -B build \
            -G Ninja \
            -S . \
            -DBUILD_DOCS=OFF \
            -DBUILD_WERROR=OFF \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DSUNSHINE_PUBLISHER_NAME="${{ github.repository_owner }}" \
            -DSUNSHINE_PUBLISHER_WEBSITE="https://github.com/${{ github.repository }}" \
            -DSUNSHINE_PUBLISHER_ISSUE_URL="https://github.com/${{ github.repository }}/issues" \
            -DPython_EXECUTABLE="${{ steps.python-path.outputs.python-path }}"

          echo "::add-matcher::.github/matchers/gcc.json"
          ninja -C build
          echo "::remove-matcher owner=gcc::"

      # ── 7. Empaquetar ─────────────────────────────────────────────────────
      - name: Package
        run: |
          mkdir -p artifacts
          cd build

          # ZIP portable (solo contiene sunshine.exe + assets, sin instalador)
          cpack -G ZIP

          # Instalador NSIS (.exe con wizard de instalación)
          cpack -G NSIS

          # Mover a /artifacts con nombres descriptivos
          mv ./cpack_artifacts/Sunshine.zip    ../artifacts/Sunshine-Windows-AMD64-portable.zip
          mv ./cpack_artifacts/Sunshine.exe    ../artifacts/Sunshine-Windows-AMD64-installer.exe

      # ── 8. Subir artefactos ───────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4
        with:
          name: Sunshine-Windows-AMD64
          path: artifacts/
          if-no-files-found: error
          retention-days: 30